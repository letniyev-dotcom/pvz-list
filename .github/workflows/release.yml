name: Build release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Onest font
        run: |
          if [ ! -f app/src/main/assets/fonts/onest.ttf ]; then
            mkdir -p app/src/main/assets/fonts
            curl -fsSL "https://github.com/google/fonts/raw/main/ofl/onest/Onest%5Bwght%5D.ttf" -o /tmp/onest.ttf \
              && mv /tmp/onest.ttf app/src/main/assets/fonts/onest.ttf \
              || echo "::warning::Onest font was not downloaded, system font will be used"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pvz-list-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
